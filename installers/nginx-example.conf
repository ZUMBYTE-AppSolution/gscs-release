# Adjust the host name and certificate paths before enabling this site.
server {
    listen 80;
    server_name gscs.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name gscs.example.com;
    ssl_certificate /etc/letsencrypt/live/gscs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gscs.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2g;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
