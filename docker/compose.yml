name: gscs
services:
  gscs:
    image: ghcr.io/zumbyte-appsolution/gscs:0.1.0-alpha.4
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    environment:
      GSCS_ROLE: master
      GSCS_LOCAL_NODE: ${GSCS_LOCAL_NODE:-true}
      GSCS_URL: ${GSCS_URL:-http://0.0.0.0:5080}
      GSCS_DOCKER_HOST_ROOT: ${GSCS_HOST_DATA:?Set the absolute host path to the GSCS data directory}
    volumes:
      - ${GSCS_HOST_DATA}:/var/lib/gscs
      # Optional: enable isolated game containers using the same GSCS image.
      # - /var/run/docker.sock:/var/run/docker.sock
