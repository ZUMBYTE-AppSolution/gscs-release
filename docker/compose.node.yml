name: gscs-node
services:
  node:
    image: ghcr.io/zumbyte-appsolution/gscs-node:0.1.0-alpha.1
    pull_policy: never
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      GSCS_ROLE: node
      GSCS_MASTER_URL: ${GSCS_MASTER_URL:?Master HTTPS URL required}
      GSCS_NODE_ID: ${GSCS_NODE_ID:?Node ID required}
      GSCS_AGENT_KEY_FILE: /run/secrets/agent_key
      GSCS_DOCKER_QUERY_HOST: host.docker.internal
      GSCS_DOCKER_HOST_ROOT: ${GSCS_HOST_DATA:?Absolute host data path required}
    secrets: [agent_key]
    volumes:
      - ${GSCS_HOST_DATA}:/var/lib/gscs
      - /var/run/docker.sock:/var/run/docker.sock
    # Agent only: no listener, no web port, no management database.
secrets:
  agent_key:
    file: ./secrets/agent_key
