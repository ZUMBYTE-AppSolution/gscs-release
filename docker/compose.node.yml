name: gscs-node
services:
  node:
    image: ghcr.io/zumbyte-appsolution/gscs:0.1.0-alpha.5
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    environment:
      GSCS_ROLE: node
      GSCS_MASTER_URL: ${GSCS_MASTER_URL:?Master HTTPS URL required}
      GSCS_NODE_ID: ${GSCS_NODE_ID:?Node ID required}
      GSCS_AGENT_KEY_FILE: /var/lib/gscs/secrets/agent_key
      GSCS_DOCKER_HOST_ROOT: ${GSCS_HOST_DATA:?Absolute host data path required}
    volumes:
      - ${GSCS_HOST_DATA}:/var/lib/gscs
      - /proc/1/net:/run/gscs-host-net:ro
      # - /var/run/docker.sock:/var/run/docker.sock
    # Agent only: no listener, no web port, no management database.
